[project]
name = "chartpilot-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "google-cloud-firestore>=2.28.1",
    "google-cloud-tasks>=2.24.0",
    "google-genai==2.18.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -m \"not live\""
markers = [
    "live: exercises the REAL Gemini API over the network (excluded from `make check`; see tests/live/README.md).",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["google.genai.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.firestore_v1.*", "google.cloud.firestore.*"]
ignore_missing_imports = true
